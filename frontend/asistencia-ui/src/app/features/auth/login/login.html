<div class="login-container">
  <div class="welcome-panel">
    <div class="welcome-content">
      <h1>Universidad Regional</h1>
      <h1>Sede San Raymundo!!</h1>
      <h1>Bienvenido!!</h1>
      <span>Nos alegra verte de nuevo.</span>
    </div>
  </div>

  <div class="login-panel">
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title class="login-title">Iniciar Sesión</mat-card-title>
        <mat-card-subtitle class="login-subtitle">
          ¿No tienes una cuenta?
          <a routerLink="../registro" class="link">Registrate</a>
        </mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Usuario</mat-label>
            <input matInput formControlName="usuario" autocomplete="username" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Contraseña</mat-label>
            <input matInput [type]="hide ? 'password' : 'text'" formControlName="password"
              autocomplete="current-password" />
            <button mat-icon-button matSuffix type="button" (click)="hide = !hide"
              [attr.aria-label]="'Toggle password visibility'">
              <mat-icon>{{ hide ? 'visibility' : 'visibility_off' }}</mat-icon>
            </button>
          </mat-form-field>

          <div class="actions">
            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
          </div>

          <div class="btn-row">
            <button mat-raised-button color="primary" class="login-button" [disabled]="loading || form.invalid">
              {{ loading ? 'Entrando…' : 'Entrar' }}
            </button>


          </div>
        </form>

        <div class="separator">
          <span>San Raymundo</span>
        </div>
