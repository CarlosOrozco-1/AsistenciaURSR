<!-- Toolbar superior con Angular Material -->
<mat-toolbar color="primary" class="shell__toolbar">
  <!-- Logo / Nombre del sistema -->
  <button mat-button class="brand" [routerLink]="'/dashboard'">
    <mat-icon aria-hidden="true">school</mat-icon>
    <span>SGAE</span>
  </button>

  <span class="spacer"></span>

  <!-- Acciones / navegación rápida (temporales) -->
  <a mat-button routerLink="/dashboard" routerLinkActive="active">Inicio</a>
  <a mat-button routerLink="/empleados" routerLinkActive="active">Empleados</a>
  <a mat-button routerLink="/clientes" routerLinkActive="active">Clientes</a>

  <!-- Botón de login/logout (placeholder) -->
  <a mat-icon-button routerLink="/login" aria-label="Login">
    <mat-icon>login</mat-icon>
  </a>
</mat-toolbar>

<!-- Contenedor principal de cada vista -->
<main class="shell__content">
  <router-outlet></router-outlet>
</main>



<footer class="shell__footer">
  <!-- Bloque social a la IZQUIERDA -->
  <div class="footer-social" aria-label="Sígueme en redes">
    <span class="social-text">Siguenos en nuetras redes sociales: </span>

    <!-- Facebook -->

      rel="noopener" aria-label="YouTube">
      <!-- SVG inline YouTube -->

  </div>

  <!-- Copia centrada (dos líneas) -->

    <small class="footer-line">© 2025 SGAE — Sistema de Gestión Académica</small>
    <small class="footer-line footer-sub">Sede San Raymundo Región 2</small>

</footer>
